name: Bug Report
description: Report a bug in go-audit
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: go-audit version
      description: "Output of `go list -m github.com/abhipray-cpu/go-audit`"
      placeholder: "v0.4.0"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: "Output of `go version`"
      placeholder: "go1.21.5 darwin/arm64"
    validations:
      required: true

  - type: dropdown
    id: adapter
    attributes:
      label: Affected adapter / plugin
      multiple: true
      options:
        - Core (no adapter)
        - PostgreSQL
        - ClickHouse
        - MySQL
        - S3 Cold Store
        - GCS Cold Store
        - OpenTelemetry plugin
        - MsgPack serializer
        - Metadata sanitizer
        - Cloner (reflect / codegen)
        - Other

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code snippet to reproduce the issue.
      render: go
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages and stack traces.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I can reproduce this on the latest release.
          required: false

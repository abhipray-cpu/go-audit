version: 2
updates:
  # Root module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"

  # PostgreSQL adapter sub-module
  - package-ecosystem: "gomod"
    directory: "/adapter/postgres"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "postgres"
    commit-message:
      prefix: "deps(postgres)"

  # ClickHouse adapter sub-module
  - package-ecosystem: "gomod"
    directory: "/adapter/clickhouse"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "clickhouse"
    commit-message:
      prefix: "deps(clickhouse)"

  # MySQL adapter sub-module
  - package-ecosystem: "gomod"
    directory: "/adapter/mysql"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "mysql"
    commit-message:
      prefix: "deps(mysql)"

  # S3 cold store sub-module
  - package-ecosystem: "gomod"
    directory: "/adapter/coldstore/s3"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "s3"
    commit-message:
      prefix: "deps(s3)"

  # GCS cold store sub-module
  - package-ecosystem: "gomod"
    directory: "/adapter/coldstore/gcs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "gcs"
    commit-message:
      prefix: "deps(gcs)"

  # OpenTelemetry plugin sub-module
  - package-ecosystem: "gomod"
    directory: "/plugin/otel"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "otel"
    commit-message:
      prefix: "deps(otel)"

  # MsgPack serializer sub-module
  - package-ecosystem: "gomod"
    directory: "/adapter/serializer/msgpack"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "msgpack"
    commit-message:
      prefix: "deps(msgpack)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

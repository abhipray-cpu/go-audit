version: "2"

run:
  timeout: 5m
  go: '1.21'

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - gocritic
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - prealloc
    - unparam
    - nakedret
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: blank-imports
          severity: error

  exclusions:
    rules:
      # Test files: relax errcheck, gocritic, unparam, unused
      - path: _test\.go
        linters: [errcheck, gocritic, unparam, unused]
      # Examples: exitAfterDefer is intentional; deferred cleanup errors are noise
      - path: ^examples/
        linters: [errcheck, gocritic, noctx]
      # Testing package: mocks deliberately skip doc comments; containers uses DialTimeout intentionally
      - path: ^testing/
        linters: [revive, noctx, errcheck, prealloc]
      # cmd: stdout write error is noise in a codegen tool
      - path: ^cmd/
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
